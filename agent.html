<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contexto de llamada</title>
<style>
  :root{--ink:#0b1f33;--muted:#5b6b7b;--line:#e6ebf0;--soft:#f5f8fa;--teal:#0e7c66;--teal2:#e7f4f0;
        --g:#1a73e8;--g2:#e8f0fe;--m:#0866ff;--m2:#e7efff;--amber:#9a5b00;--amber2:#fff4e0;--red:#b3261e;--red2:#fdecea}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fff;font-size:13.5px;line-height:1.45}
  .wrap{padding:14px 16px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  h2{margin:0;font-size:15px;font-weight:700}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .ok{background:var(--teal2);color:var(--teal)}.no{background:var(--amber2);color:var(--amber)}.err{background:var(--red2);color:var(--red)}
  .wait{background:var(--soft);color:var(--muted)}
  .hero{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
  .src{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;color:#fff}
  .src.google{background:var(--g)}.src.meta{background:var(--m)}.src.other{background:#8a98a6}
  .hero .camp{font-size:16px;font-weight:700}
  .hero .sub{color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .kv{background:var(--soft);border-radius:8px;padding:7px 10px;min-width:0}
  .kv .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .kv .v{font-weight:600;word-break:break-all}
  .sec{margin-top:14px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .tl{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
  .tl li{position:relative;padding:3px 0 7px 8px}
  .tl li::before{content:"";position:absolute;left:-20px;top:8px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--teal)}
  .tl li.call::before{background:var(--teal)}
  .tl .t{font-size:11.5px;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  button{border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:13px;font-family:inherit}
  .b1{background:var(--teal);color:#fff}.b2{background:var(--soft);color:var(--ink)}
  .res{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .res .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--muted);font-size:12px}
  pre{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
  .muted{color:var(--muted)}
  .chan{background:var(--soft);color:var(--ink)}
  .msg{margin-top:10px;background:var(--teal2);border-radius:10px 10px 10px 2px;padding:9px 12px;font-size:13px}
  .msg .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:2px}
  .attach{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
  .attach input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;width:130px;text-transform:uppercase;margin-right:6px}
  .empty{margin-top:14px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h2 id="h2">Contexto de la llamada</h2><span><span id="chan" class="pill chan" style="display:none"></span> <span id="badge" class="pill wait">Esperando contacto…</span></span></div>
  <div id="body"><div class="empty">Cuando entre una llamada a un número de campaña, aquí verás de qué anuncio viene y qué vio el paciente.</div></div>
  <div class="actions" id="actions" style="display:none">
    <button class="b1" id="btnCita">Cita agendada → enviar conversión</button>
    <button class="b2" id="btnNo">Sin cita</button>
  </div>
  <div id="result"></div>
  <details id="waLink" style="margin-top:16px"><summary>¿Conversación de WhatsApp? Vincular por código</summary>
    <div class="attach"><div class="muted" style="margin-bottom:8px">Captura el código que viene en el mensaje del paciente (ej. PC-7K2Q).</div>
    <input id="refIn2" placeholder="PC-XXXX" maxlength="7"><button class="b2" id="refBtn2">Vincular</button> <span id="refErr2" class="muted"></span></div>
  </details>
</div>
<script>
const qs = new URLSearchParams(location.search);
let contactId = qs.get('contactId');
let shown = null, nfShown = false;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm = iso => { try { return new Date(iso).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch(e){ return ''; } };
const pageName = p => ({'/':'Inicio de la landing','/especialidades/dermatologia':'Dermatología','/especialidades/pediatria':'Pediatría','/precios':'Precios','/sucursales':'Sucursales'}[p] || p);

function source(a){
  const s = (a?.utm_source || '').toLowerCase();
  if (a?.gclid || s.includes('google')) return {cls:'google', ch:'G', name:'Google Ads'};
  if (a?.fbclid || /facebook|meta|instagram|fb|ig/.test(s)) return {cls:'meta', ch:'M', name:'Meta Ads'};
  return {cls:'other', ch:'•', name: s ? s : 'Directo / orgánico'};
}

function render(c){
  if (!c) return;
  const key = c.contactId + (c.attributed ? 'a' : 'n') + (c.ref || '') + JSON.stringify(c.conversion);
  if (shown === key) return;
  shown = key;
  const a = c.attribution;
  const wa = c.channel === 'whatsapp';
  const noun = wa ? 'Conversación' : 'Llamada';
  document.getElementById('h2').textContent = wa ? 'Contexto de WhatsApp' : 'Contexto de la llamada';
  const chan = document.getElementById('chan'); chan.style.display = ''; chan.textContent = wa ? 'WhatsApp' : 'Voz';
  const badge = document.getElementById('badge');
  badge.className = 'pill ' + (c.attributed ? 'ok' : 'no');
  badge.textContent = c.attributed ? '● ' + noun + ' atribuida' : '● Sin atribución';
  const fromLbl = wa ? 'WhatsApp desde' : 'Llama desde (ANI)';
  const toLbl = wa ? 'Código de visita' : 'Número marcado (DNIS)';
  const toVal = wa ? (c.ref || '—') : c.dnis;
  const msgHtml = wa && c.message ? '<div class="msg"><div class="k">Primer mensaje</div>' + esc(c.message) + '</div>' : '';

  let html = '';
  if (a) {
    const src = source(a);
    const clickId = a.gclid ? ['GCLID', a.gclid] : a.fbclid ? ['FBCLID', a.fbclid] : ['Click ID', '—'];
    html += '<div class="hero"><div class="src ' + src.cls + '">' + src.ch + '</div><div>' +
      '<div class="sub">' + esc(src.name) + ' · ' + esc(a.utm_medium || '—') + '</div>' +
      '<div class="camp">' + esc(a.utm_campaign || 'Sin campaña') + '</div>' +
      '<div class="sub">Término: ' + esc(a.utm_term || '—') + (a.utm_content ? ' · Anuncio: ' + esc(a.utm_content) : '') + '</div></div></div>';
    html += '<div class="grid">' +
      '<div class="kv"><div class="k">' + fromLbl + '</div><div class="v">' + esc(c.ani || '—') + '</div></div>' +
      '<div class="kv"><div class="k">' + toLbl + '</div><div class="v">' + esc(toVal) + '</div></div>' +
      '<div class="kv"><div class="k">' + clickId[0] + '</div><div class="v">' + esc(String(clickId[1]).slice(0, 28)) + (String(clickId[1]).length > 28 ? '…' : '') + '</div></div>' +
      '<div class="kv"><div class="k">Contact ID</div><div class="v">' + esc(c.contactId) + '</div></div></div>';
    const items = [];
    if (a.firstSeen) items.push({t:a.firstSeen, txt:'Llegó desde el anuncio de <b>' + esc(src.name) + '</b>'});
    (a.pages || []).forEach(p => { if (p.page && p.page !== '/') items.push({t:p.at, txt:'Vio <b>' + esc(pageName(p.page)) + '</b>'}); });
    items.push(wa ? {t:c.receivedAt, txt:'<b>Escribió por WhatsApp</b> con el código ' + esc(c.ref || ''), call:true} : {t:c.receivedAt, txt:'<b>Llamó</b> al ' + esc(c.dnis), call:true});
    html += msgHtml;
    html += '<div class="sec">Recorrido del paciente</div><ul class="tl">' +
      items.map(i => '<li' + (i.call ? ' class="call"' : '') + '><span class="t">' + hm(i.t) + '</span>' + i.txt + '</li>').join('') + '</ul>';
  } else if (wa) {
    html += '<div class="grid">' +
      '<div class="kv"><div class="k">WhatsApp desde</div><div class="v">' + esc(c.ani || '—') + '</div></div>' +
      '<div class="kv"><div class="k">Contact ID</div><div class="v">' + esc(c.contactId) + '</div></div></div>' + msgHtml +
      attachHtml('El mensaje no trae un código de visita. Si el paciente lo menciona, captúralo aquí.');
  } else {
    html += '<div class="grid">' +
      '<div class="kv"><div class="k">Llama desde (ANI)</div><div class="v">' + esc(c.ani) + '</div></div>' +
      '<div class="kv"><div class="k">Número marcado (DNIS)</div><div class="v">' + esc(c.dnis) + '</div></div></div>' +
      '<div class="empty">No hay una visita web vigente para este número: llamada directa, número guardado o reserva vencida. Se atiende normal, sin conversión publicitaria.</div>';
  }
  document.getElementById('body').innerHTML = html;
  document.getElementById('actions').style.display = c.conversion ? 'none' : 'flex';
  document.getElementById('result').innerHTML = c.conversion ? resultHtml(c.conversion) : '';
}

function attachHtml(msg){
  return '<div class="attach"><div class="muted" style="margin-bottom:8px">' + esc(msg) + '</div>' +
    '<input id="refIn" placeholder="PC-XXXX" maxlength="7"><button class="b2" id="refBtn">Vincular</button> <span id="refErr" class="muted"></span></div>';
}
async function attach(){
  const ref = (document.getElementById('refIn').value || '').trim();
  if (!ref) return;
  const r = await fetch('/api/wa/attach', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contactId, ref, from: qs.get('from') || undefined }) });
  if (!r.ok) { document.getElementById('refErr').textContent = 'Código no encontrado o vencido'; return; }
  shown = null; load();
}
document.addEventListener('click', e => { if (e.target && e.target.id === 'refBtn') attach(); });
document.getElementById('refBtn2').onclick = async () => {
  const ref = (document.getElementById('refIn2').value || '').trim().toUpperCase();
  if (!ref) return;
  const id = 'WA-' + ref;
  const r = await fetch('/api/wa/attach', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contactId: id, ref }) });
  if (!r.ok) { document.getElementById('refErr2').textContent = 'Código no encontrado o vencido'; return; }
  document.getElementById('refErr2').textContent = ''; document.getElementById('refIn2').value = '';
  document.getElementById('waLink').open = false;
  contactId = qs.get('contactId') ? contactId : null; shown = null; load();
};

function stat(r, name, skippedTxt){
  if (!r) return '<span class="pill wait">' + name + ' · —</span>';
  if (r.skipped) return '<span class="pill wait">' + name + ' · ' + skippedTxt + '</span>';
  if (r.error) return '<span class="pill err">' + name + ' · error</span>';
  const ok = r.mode === 'mock' || (r.status >= 200 && r.status < 300);
  return '<span class="pill ' + (ok ? 'ok' : 'err') + '">' + (ok ? '✓ ' : '✕ ') + name + ' · ' + esc((r.api ? r.api + ' · ' : '') + (r.mode || '') + ' ' + (r.status || '')) + '</span>';
}

function resultHtml(conv){
  if (conv.outcome !== 'cita_agendada') return '<div class="res"><b>Sin cita</b><div class="muted">Disposición registrada. No se envía conversión a las plataformas.</div></div>';
  const g = conv.google || {}, m = conv.meta || {};
  return '<div class="res"><b>Cita agendada · conversión enviada</b> <span class="muted">' + hm(conv.at) + '</span>' +
    '<div class="row">' + stat(g, 'Google', 'sin GCLID') + stat(m, 'Meta', 'omitido') + '</div>' +
    '<details><summary>Ver lo que se envió a Google y Meta</summary><pre>' +
    esc(JSON.stringify({ google_request: g.request, meta_request: m.request }, null, 2)) + '</pre></details></div>';
}

async function load(){
  try {
    const url = contactId ? '/api/calls/' + encodeURIComponent(contactId) : '/api/calls/latest';
    const r = await fetch(url);
    if (r.ok) { const c = await r.json(); if (c) { if (!contactId) contactId = c.contactId; render(c); } }
    else if (r.status === 404 && qs.get('contactId') && qs.get('channel') === 'whatsapp' && !nfShown) {
      nfShown = true;
      render({ contactId, channel: 'whatsapp', ani: qs.get('from') || '', receivedAt: new Date().toISOString(), attributed: false, attribution: null, conversion: null });
    }
  } catch(e){}
}
async function send(outcome){
  document.getElementById('actions').style.display = 'none';
  document.getElementById('result').innerHTML = '<div class="res muted">Enviando…</div>';
  await fetch('/api/conversion', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contactId, outcome }) });
  shown = null; load();
}
document.getElementById('btnCita').onclick = () => send('cita_agendada');
document.getElementById('btnNo').onclick = () => send('sin_cita');

// Modo Custom Workspace (sin contactId): sigue la última llamada
load();
setInterval(() => { if (!qs.get('contactId')) contactId = null; load(); }, 2000);
</script>
</body>
</html>
